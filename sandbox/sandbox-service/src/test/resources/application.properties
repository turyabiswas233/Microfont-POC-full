# Spring Boot
spring.application.name=provider
spring.main.banner-mode=off
server.port=8080
# Microcube Mocking
microcube.mocking.enabled=false
microcube.mocking.data=10
# Microcube Logging
microcube.logging.host=localhost
microcube.logging.port=5000
microcube.logging.level=DEBUG
# Microcube Messaging
microcube.messaging.enabled=false
microcube.messaging.interval=1000
microcube.messaging.retry=5